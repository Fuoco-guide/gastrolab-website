<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — The Gastro Lab</title>
  <meta name="description" content="Food photography portfolio by The Gastro Lab — professional images for food bloggers and recipe websites.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body.page-gallery { background: #ffffff; }

    body.page-gallery nav {
      background: #ffffff;
      border-bottom-color: rgba(26,24,20,0.07);
    }
    body.page-gallery nav.scrolled { box-shadow: 0 2px 16px rgba(26,24,20,0.07); }
    body.page-gallery .nav-logo-img        { filter: brightness(0); }
    body.page-gallery .nav-links a         { color: rgba(26,24,20,0.6); }
    body.page-gallery .nav-links a:hover,
    body.page-gallery .nav-links a.active  { color: #1a1814; }
    body.page-gallery .nav-links a::after  { background: #1a1814; }
    body.page-gallery .nav-toggle span     { background: #1a1814; }

    @media (max-width: 768px) {
      body.page-gallery .nav-links.open { background: rgba(10,10,10,0.97); }
      body.page-gallery .nav-links.open a { color: rgba(245,240,232,0.8); }
      body.page-gallery .nav-links.open a:hover,
      body.page-gallery .nav-links.open a.active { color: #fff; }
    }

    /* ── PAGE TITLE ── */
    .gallery-header {
      padding: 100px 28px 60px;
      text-align: center;
      background: #ffffff;
    }
    .gallery-header .label {
      display: block;
      margin-bottom: 16px;
      font-size: 0.82rem;
      letter-spacing: 0.22em;
    }
    .gallery-header h1 {
      font-size: clamp(2.8rem, 6vw, 5rem);
      color: #1a1814;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .gallery-header-divider {
      width: 40px;
      height: 1px;
      background: var(--gold);
      margin: 28px auto 0;
    }

    /* ── GRID ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 0 4px 4px;
      align-items: start;
    }

    .gallery-grid-item {
      overflow: hidden;
      background: #f0ece6;
      display: block;
    }

    .gallery-grid-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .gallery-grid-item:hover img { transform: scale(1.03); }

    /* Footer */
    body.page-gallery footer {
      background: #ffffff;
      border-top-color: rgba(26,24,20,0.08);
    }
    body.page-gallery .footer-copy { color: #a09890; }
    body.page-gallery .footer-ig   { color: #8a7e72; }
    body.page-gallery .footer-ig:hover { color: var(--gold); }

    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: 1fr; gap: 3px; padding: 0 3px 3px; }
      .gallery-header { padding: 80px 28px 44px; }
    }
  </style>
</head>
<body class="page-gallery">
